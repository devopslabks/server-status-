apiVersion: apps/v1
kind: Deployment
metadata:
  name: server-status
spec:
  replicas: 2
  selector:
    matchLabels:
      app: server-status
  template:
    metadata:
      labels:
        app: server-status
    spec:
      containers:
        - name: server-status
          image: server_status:3.0
          imagePullPolicy: Never


